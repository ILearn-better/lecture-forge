[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lectureforge"
version = "0.1.0"
description = "Turn raw class recordings into polished lectures with bilingual subtitles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zhoulikun" }]
keywords = ["lecture", "subtitles", "whisper", "asr", "video", "education", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "opencc-python-reimplemented>=0.1.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
demo = ["edge-tts>=6.1"]

[project.urls]
Homepage = "https://github.com/ILearn-better/lecture-forge"
Issues = "https://github.com/ILearn-better/lecture-forge/issues"

[project.scripts]
lectureforge = "lectureforge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
